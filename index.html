<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mots croisés</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🧩 Mots croisés</h1>
    <p>Remplissez directement la grille. Vos réponses sont enregistrées sur cet appareil.</p>
  </header>

  <main>
    <div class="toolbar">
      <button onclick="check()">✓ Vérifier</button>
      <button class="secondary" onclick="clearGrid()">Effacer</button>
      <button class="secondary" onclick="window.print()">Imprimer</button>
      <span id="status">0 case remplie</span>
    </div>

    <div class="board" id="board"></div>
  </main>

  <script src="script.js"></script>

</body>
</html>
